name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble

    steps:
      - uses: actions/checkout@v4

      - name: Install root dependencies
        run: npm ci

      - name: Install all service dependencies
        run: ./scripts/install.sh

      - name: Start services
        run: ./scripts/start.sh &
        env:
          CI: true

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 10
          # Check auth-server
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:4000/.well-known/openid-configuration
          # Check api-server
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:5001/api/data || true
          # Check app-bff
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:3000
          # Check app-spa
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:3001
          # Check app-web
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:3002

      - name: Run Playwright tests
        run: npx playwright test --reporter=github

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

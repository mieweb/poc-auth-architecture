# Nginx reverse proxy configuration for PoC Auth Architecture
# Maps hostnames to backend services with SSL termination

# Upstream definitions
upstream auth_server {
    server 127.0.0.1:4000;
}

upstream api_server {
    server 127.0.0.1:5001;
}

upstream app_bff {
    server 127.0.0.1:3000;
}

upstream app_spa {
    server 127.0.0.1:3001;
}

upstream app_web {
    server 127.0.0.1:3002;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name auth.local api.local bff.local spa.local web.local;
    return 301 https://$host$request_uri;
}

# Auth Server - auth.local
server {
    listen 443 ssl;
    server_name auth.local;

    ssl_certificate /etc/nginx/ssl/local.crt;
    ssl_certificate_key /etc/nginx/ssl/local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://auth_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API Server - api.local
server {
    listen 443 ssl;
    server_name api.local;

    ssl_certificate /etc/nginx/ssl/local.crt;
    ssl_certificate_key /etc/nginx/ssl/local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # CORS headers for SPA
    add_header Access-Control-Allow-Origin "https://spa.local" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Allow-Credentials "true" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# BFF App - bff.local
server {
    listen 443 ssl;
    server_name bff.local;

    ssl_certificate /etc/nginx/ssl/local.crt;
    ssl_certificate_key /etc/nginx/ssl/local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://app_bff;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
}

# SPA App - spa.local
server {
    listen 443 ssl;
    server_name spa.local;

    ssl_certificate /etc/nginx/ssl/local.crt;
    ssl_certificate_key /etc/nginx/ssl/local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
